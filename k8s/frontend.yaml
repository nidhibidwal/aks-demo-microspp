apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: microapp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend
        image: acrmicroapp.azurecr.io/frontend:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 5000

        env:
        - name: BACKEND_URL
          value: "http://backend-service:5000"

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "250m"
            memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: microapp

spec:
  type: LoadBalancer

  selector:
    app: frontend

  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
