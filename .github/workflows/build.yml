name: Build and Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login acrmicroapp.azurecr.io \
            -u "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      - name: Build and Push Frontend
        run: |
          docker build -t acrmicroapp.azurecr.io/frontend:latest ./frontend
          docker push acrmicroapp.azurecr.io/frontend:latest

      - name: Build and Push Backend
        run: |
          docker build -t acrmicroapp.azurecr.io/backend:latest ./backend
          docker push acrmicroapp.azurecr.io/backend:latest
